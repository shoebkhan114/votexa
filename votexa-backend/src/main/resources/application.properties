spring.application.name=votexa-backend
server.port=${PORT:8080}

# --- PostgreSQL (password comes from environment, never commit it) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/votexadb}
spring.datasource.username=${DB_USER:shoeb114}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema; Hibernate only maps it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# DB created earlier with db-scripts/setup-db.sh? Flyway adopts it at version 2.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# --- Security ---
votexa.jwt.secret=${JWT_SECRET:votexa-dev-secret-change-me-0123456789abcdef-0123456789}
votexa.jwt.expiry-minutes=480
votexa.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
votexa.keys-dir=${KEYS_DIR:./keys}
# Hosted mode: set both so the signing key survives restarts (free hosts lose local files).
votexa.keys.private-b64=${AUTHORITY_PRIVATE_B64:}
votexa.keys.public-b64=${AUTHORITY_PUBLIC_B64:}

# --- Ledger: local (Java hash-chain file) or fabric (needs -Pfabric + running network) ---
# LEDGER_MODE: local (file, default) | db (PostgreSQL table, for hosting) | fabric
votexa.ledger.mode=${LEDGER_MODE:local}
votexa.ledger.local-file=${LEDGER_FILE:./ledger/local-ledger.jsonl}

# --- Polling ---
votexa.polling.enforce-window=true
votexa.duplicate.threshold=85.0
